<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="schedule-container">

        <h2>⌛Task Scheduler for test</h2>
        
        <div class="input-area">

            <input type="text" id="textInput" placeholder=" Enter a task"/>
            <input type="number" id="delayInput" placeholder="Delay in (sec)" min="1">
            <button onclick="scheduleTask()">Schedule</button>
            <button onclick="clearAllTasks()">Clear All</button>


        </div>

        <div class="logs" id="logArea">

            <p><strong>Scheduled task will appear here after execution:</strong></p>

        </div>



    </div>



    
    <script src="./script.js"></script>
</body>
</html>
